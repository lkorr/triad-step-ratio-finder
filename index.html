<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just-Intonation Chord Explorer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root, [data-theme="midnight"] {
  --bg:#1a1a2e; --bg-surface:#16213e; --bg-input:#0d1528; --bg-filter:#1a1a3e;
  --bg-btn:#1e2a4a; --bg-btn-play:#1a2a3a; --border:#0f3460; --border-grid:#2a3a5a;
  --border-section:#1e2a4a; --text:#e0e0e0; --text-dim:#a0a0c0; --text-muted:#8888aa;
  --text-faint:#556; --text-btn:#8899bb; --accent:#e94560; --accent-bright:#f5a623;
  --accent-dark:#6eb5ff; --accent-green:#50c878; --accent-purple:#bb86fc;
  --scrollbar:#2a3a5a; --tooltip-bg:#16213ef0; --panel-bg:#16213ef0;
  --resize-hover:#e9456044; --canvas-bg:#1a1a2e;
  --bright-tint:rgba(245,166,35,0.04); --dark-tint:rgba(110,181,255,0.04);
  --bright-label:rgba(245,166,35,0.35); --dark-label:rgba(110,181,255,0.35);
  --grid-stroke:rgba(42,58,90,0.5); --axis-stroke:rgba(136,136,170,0.35);
  --axis-label:rgba(136,136,170,0.5); --ref-stroke:rgba(187,134,252,0.2);
  --ref-label:rgba(187,134,252,0.35); --region-label:rgba(160,160,192,0.25);
  --bright-tick:rgba(245,166,35,0.7); --dark-tick:rgba(110,181,255,0.7);
  --hue-shift:0; --sat-scale:1.0;
}

[data-theme="ember"] {
  --bg:#1c1210; --bg-surface:#2a1a16; --bg-input:#150d0a; --bg-filter:#221412;
  --bg-btn:#3a2218; --bg-btn-play:#2e1c14; --border:#4a2a1a; --border-grid:#5a3a28;
  --border-section:#3a2218; --text:#f0ddd0; --text-dim:#c0a090; --text-muted:#aa8870;
  --text-faint:#6a4a3a; --text-btn:#bb8866; --accent:#ff6b35; --accent-bright:#ffb347;
  --accent-dark:#e8524a; --accent-green:#7dce82; --accent-purple:#d4845a;
  --scrollbar:#5a3a28; --tooltip-bg:#2a1a16f0; --panel-bg:#2a1a16f0;
  --resize-hover:#ff6b3544; --canvas-bg:#1c1210;
  --bright-tint:rgba(255,179,71,0.05); --dark-tint:rgba(232,82,74,0.04);
  --bright-label:rgba(255,179,71,0.35); --dark-label:rgba(232,82,74,0.35);
  --grid-stroke:rgba(90,58,40,0.5); --axis-stroke:rgba(170,136,112,0.35);
  --axis-label:rgba(170,136,112,0.5); --ref-stroke:rgba(212,132,90,0.25);
  --ref-label:rgba(212,132,90,0.4); --region-label:rgba(192,160,140,0.25);
  --bright-tick:rgba(255,179,71,0.7); --dark-tick:rgba(232,82,74,0.7);
  --hue-shift:-20; --sat-scale:0.85;
}

[data-theme="ocean"] {
  --bg:#0a1628; --bg-surface:#0e1e38; --bg-input:#061020; --bg-filter:#0c1a30;
  --bg-btn:#142a4e; --bg-btn-play:#0e2240; --border:#1a3a6a; --border-grid:#244a7a;
  --border-section:#1a3a6a; --text:#d0e4f0; --text-dim:#90b0cc; --text-muted:#6a90b0;
  --text-faint:#3a5a7a; --text-btn:#6a9abb; --accent:#00bcd4; --accent-bright:#4dd0e1;
  --accent-dark:#2979ff; --accent-green:#26a69a; --accent-purple:#7986cb;
  --scrollbar:#244a7a; --tooltip-bg:#0e1e38f0; --panel-bg:#0e1e38f0;
  --resize-hover:#00bcd444; --canvas-bg:#0a1628;
  --bright-tint:rgba(77,208,225,0.04); --dark-tint:rgba(41,121,255,0.04);
  --bright-label:rgba(77,208,225,0.35); --dark-label:rgba(41,121,255,0.35);
  --grid-stroke:rgba(36,74,122,0.5); --axis-stroke:rgba(106,144,176,0.35);
  --axis-label:rgba(106,144,176,0.5); --ref-stroke:rgba(121,134,203,0.25);
  --ref-label:rgba(121,134,203,0.4); --region-label:rgba(106,144,176,0.25);
  --bright-tick:rgba(77,208,225,0.7); --dark-tick:rgba(41,121,255,0.7);
  --hue-shift:30; --sat-scale:1.1;
}

[data-theme="verdant"] {
  --bg:#0e1a10; --bg-surface:#142816; --bg-input:#0a140c; --bg-filter:#121e14;
  --bg-btn:#1e3a20; --bg-btn-play:#1a3018; --border:#1a4a20; --border-grid:#2a5a32;
  --border-section:#1e3a20; --text:#d4e8d6; --text-dim:#98c09a; --text-muted:#6e9a70;
  --text-faint:#3a5a3c; --text-btn:#70aa74; --accent:#66bb6a; --accent-bright:#aed581;
  --accent-dark:#26a69a; --accent-green:#81c784; --accent-purple:#a5d6a7;
  --scrollbar:#2a5a32; --tooltip-bg:#142816f0; --panel-bg:#142816f0;
  --resize-hover:#66bb6a44; --canvas-bg:#0e1a10;
  --bright-tint:rgba(174,213,129,0.05); --dark-tint:rgba(38,166,154,0.04);
  --bright-label:rgba(174,213,129,0.35); --dark-label:rgba(38,166,154,0.35);
  --grid-stroke:rgba(42,90,50,0.5); --axis-stroke:rgba(110,154,112,0.35);
  --axis-label:rgba(110,154,112,0.5); --ref-stroke:rgba(165,214,167,0.2);
  --ref-label:rgba(165,214,167,0.35); --region-label:rgba(110,154,112,0.25);
  --bright-tick:rgba(174,213,129,0.7); --dark-tick:rgba(38,166,154,0.7);
  --hue-shift:90; --sat-scale:0.9;
}

[data-theme="aubergine"] {
  --bg:#1a1020; --bg-surface:#261830; --bg-input:#120a18; --bg-filter:#1e1428;
  --bg-btn:#362044; --bg-btn-play:#2c1a3a; --border:#3a2060; --border-grid:#4a3070;
  --border-section:#362044; --text:#e4d6f0; --text-dim:#b8a0cc; --text-muted:#8a70aa;
  --text-faint:#5a3a6a; --text-btn:#a080bb; --accent:#ce93d8; --accent-bright:#f48fb1;
  --accent-dark:#9575cd; --accent-green:#80cbc4; --accent-purple:#b39ddb;
  --scrollbar:#4a3070; --tooltip-bg:#261830f0; --panel-bg:#261830f0;
  --resize-hover:#ce93d844; --canvas-bg:#1a1020;
  --bright-tint:rgba(244,143,177,0.05); --dark-tint:rgba(149,117,205,0.04);
  --bright-label:rgba(244,143,177,0.35); --dark-label:rgba(149,117,205,0.35);
  --grid-stroke:rgba(74,48,112,0.5); --axis-stroke:rgba(138,112,170,0.35);
  --axis-label:rgba(138,112,170,0.5); --ref-stroke:rgba(179,157,219,0.25);
  --ref-label:rgba(179,157,219,0.4); --region-label:rgba(138,112,170,0.25);
  --bright-tick:rgba(244,143,177,0.7); --dark-tick:rgba(149,117,205,0.7);
  --hue-shift:-60; --sat-scale:1.05;
}

[data-theme="monochrome"] {
  --bg:#141414; --bg-surface:#1e1e1e; --bg-input:#0c0c0c; --bg-filter:#1a1a1a;
  --bg-btn:#2a2a2a; --bg-btn-play:#222222; --border:#333333; --border-grid:#3a3a3a;
  --border-section:#2a2a2a; --text:#e0e0e0; --text-dim:#a0a0a0; --text-muted:#808080;
  --text-faint:#505050; --text-btn:#909090; --accent:#ffffff; --accent-bright:#d0d0d0;
  --accent-dark:#909090; --accent-green:#b0b0b0; --accent-purple:#c0c0c0;
  --scrollbar:#3a3a3a; --tooltip-bg:#1e1e1ef0; --panel-bg:#1e1e1ef0;
  --resize-hover:#ffffff22; --canvas-bg:#141414;
  --bright-tint:rgba(208,208,208,0.03); --dark-tint:rgba(144,144,144,0.03);
  --bright-label:rgba(224,224,224,0.30); --dark-label:rgba(160,160,160,0.30);
  --grid-stroke:rgba(58,58,58,0.5); --axis-stroke:rgba(128,128,128,0.35);
  --axis-label:rgba(128,128,128,0.5); --ref-stroke:rgba(192,192,192,0.15);
  --ref-label:rgba(192,192,192,0.3); --region-label:rgba(160,160,160,0.20);
  --bright-tick:rgba(224,224,224,0.6); --dark-tick:rgba(160,160,160,0.6);
  --hue-shift:0; --sat-scale:0.15;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
* { scrollbar-width: thin; scrollbar-color: var(--scrollbar) transparent; }

/* ── Top bar ── */
#top-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 20px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
}
#top-bar .app-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}
.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-dim);
}
.ctrl-group label { cursor: default; white-space: nowrap; }
.ctrl-group input[type="number"] {
  width: 52px;
  background: var(--bg-input);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--text);
  padding: 2px 4px;
  font-size: 11px;
  font-family: monospace;
  text-align: center;
}
.ctrl-group input[type="number"]:focus { border-color: var(--accent); outline: none; }
.ctrl-group input[type="number"]::-webkit-inner-spin-button,
.ctrl-group input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
.ctrl-group input[type="number"] { -moz-appearance: textfield; }
.ctrl-group select {
  background: var(--bg-input);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--text);
  padding: 2px 4px;
  font-size: 11px;
  cursor: pointer;
}
.ctrl-group select:focus { border-color: var(--accent); outline: none; }

/* ── Theme picker ── */
.theme-picker { position: relative; margin-left: auto; }
.theme-btn {
  display: flex; align-items: center; gap: 5px;
  background: var(--bg-input); border: 1px solid var(--border-grid); border-radius: 4px;
  color: var(--text-dim); padding: 3px 8px; font-size: 11px; cursor: pointer;
  font-family: inherit; transition: border-color 0.15s, color 0.15s;
}
.theme-btn:hover { border-color: var(--accent); color: var(--text); }
.theme-btn svg { width: 14px; height: 14px; }
.theme-dropdown {
  display: none; position: absolute; right: 0; top: calc(100% + 4px);
  background: var(--bg-surface); border: 1px solid var(--border-grid); border-radius: 6px;
  padding: 4px 0; z-index: 200; min-width: 160px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.theme-dropdown.open { display: block; }
.theme-option {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  cursor: pointer; font-size: 12px; color: var(--text-dim); border: none;
  background: none; width: 100%; text-align: left; font-family: inherit;
  transition: background 0.1s;
}
.theme-option:hover { background: var(--bg-btn); color: var(--text); }
.theme-option.active { color: var(--accent); font-weight: 600; }
.theme-swatch {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid transparent; flex-shrink: 0;
}
.theme-option.active .theme-swatch { border-color: var(--accent); }

/* ── Filter bar ── */
#filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 20px;
  background: var(--bg-filter);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  flex-wrap: wrap;
  font-size: 12px;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
}
.filter-group label { white-space: nowrap; }
.filter-group select, .filter-group input[type="number"] {
  background: var(--bg-input);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--text);
  padding: 2px 4px;
  font-size: 11px;
}
.filter-group input[type="number"] {
  width: 46px;
  font-family: monospace;
  text-align: center;
}
.filter-group select { cursor: pointer; }
.filter-group select:focus, .filter-group input:focus { border-color: var(--accent); outline: none; }
.filter-group input[type="number"]::-webkit-inner-spin-button,
.filter-group input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
.filter-group input[type="number"] { -moz-appearance: textfield; }
.filter-group input[type="range"] {
  width: 90px;
  height: 4px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border-grid);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
.filter-group input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent-dark);
  border: 1px solid var(--bg-input);
  cursor: pointer;
}
.filter-group input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent-dark);
  border: 1px solid var(--bg-input);
  cursor: pointer;
}
.filter-group .range-val {
  font-family: monospace;
  font-size: 11px;
  color: var(--text);
  min-width: 24px;
  text-align: right;
}
.filter-sep { color: var(--border-grid); }
#chord-count { color: var(--accent-dark); font-weight: 600; margin-left: auto; }

.filter-btn {
  background: var(--bg-btn);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--text-btn);
  font-size: 11px;
  padding: 2px 8px;
  cursor: pointer;
  font-family: inherit;
}
.filter-btn:hover { border-color: var(--accent-dark); color: var(--text); }

/* ── Canvas plot ── */
#plot-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
#plot-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: var(--tooltip-bg);
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 12px;
  pointer-events: none;
  display: none;
  z-index: 100;
  max-width: 280px;
  line-height: 1.6;
}
#tooltip .tt-ratio { font-weight: 700; color: var(--accent); font-size: 14px; }
#tooltip .tt-name { color: var(--text); }
#tooltip .tt-detail { color: var(--text-dim); }
#tooltip .tt-detail span { font-family: monospace; }
.tt-bright { color: var(--accent-bright); }
.tt-neutral { color: var(--text-muted); }
.tt-dark { color: var(--accent-dark); }

/* ── Bottom info panel ── */
#info-panel {
  flex-shrink: 0;
  height: 0;
  background: var(--panel-bg);
  border-top: 1px solid var(--border);
  overflow: hidden;
  transition: height 0.2s ease;
  display: flex;
  flex-direction: column;
  position: relative;
}
#info-panel.open {
  height: 240px;
}

#info-panel .panel-resize {
  height: 5px;
  cursor: ns-resize;
  flex-shrink: 0;
  background: transparent;
}
#info-panel .panel-resize:hover,
#info-panel .panel-resize:active {
  background: var(--resize-hover);
}

#info-panel .panel-inner {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  gap: 16px;
  padding: 6px 16px 10px;
  min-height: 0;
}
.panel-roll-col {
  flex: 1;
  min-width: 60px;
  align-self: flex-start;
  height: 56px;
}
.panel-roll-col canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Panel columns */
.panel-header-col {
  flex-shrink: 0;
  width: 200px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.panel-ratio {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  font-family: monospace;
  word-break: break-all;
}
.panel-name {
  font-size: 14px;
  color: var(--text);
  font-weight: 600;
  min-height: 1.4em;
}
.panel-generic {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
}
.panel-wiki a {
  color: var(--accent-dark);
  text-decoration: none;
  font-size: 11px;
}
.panel-wiki a:hover { text-decoration: underline; }
.panel-audio {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 4px;
}
.panel-audio select, .panel-audio input[type="number"] {
  background: var(--bg-input);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--text);
  padding: 2px 4px;
  font-size: 11px;
}
.panel-audio input[type="number"] { width: 55px; font-family: monospace; }
.panel-audio input[type="number"]::-webkit-inner-spin-button,
.panel-audio input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
.panel-audio input[type="number"] { -moz-appearance: textfield; }
.panel-audio select { cursor: pointer; }
.panel-audio label { font-size: 10px; color: var(--text-muted); }
.panel-play-btn {
  background: var(--bg-btn-play);
  border: 1px solid var(--border-grid);
  border-radius: 4px;
  color: var(--accent-green);
  font-size: 12px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: inherit;
}
.panel-play-btn:hover { background: var(--border-grid); border-color: var(--accent-green); }
.panel-stop-btn {
  background: var(--bg-btn-play);
  border: 1px solid var(--border-grid);
  border-radius: 4px;
  color: var(--accent);
  font-size: 12px;
  padding: 3px 8px;
  cursor: pointer;
  font-family: inherit;
}
.panel-stop-btn:hover { border-color: var(--accent); }

.panel-desc-col {
  flex-shrink: 0;
  width: 420px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
.panel-desc-row {
  display: flex;
  gap: 12px;
  align-items: start;
}
.panel-desc-row > .panel-section {
  flex: 1 1 0;
  min-width: 0;
}
.panel-section {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.panel-section-title {
  font-size: 11px;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 0 0 3px 0;
  border-bottom: 1px solid var(--border-section);
  margin-bottom: 2px;
}
.panel-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 1px 0;
}
.panel-row-label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.panel-row-value {
  font-size: 14px;
  font-family: monospace;
  color: var(--text);
  font-weight: 600;
  text-align: right;
  white-space: nowrap;
}

.panel-edo-col {
  flex-shrink: 0;
  overflow-y: auto;
  min-height: 0;
}
.panel-edo-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-dark);
  margin-bottom: 4px;
}
.panel-edo-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.panel-edo-table th {
  padding: 3px 6px;
  background: var(--bg-input);
  color: var(--text-dim);
  font-weight: 600;
  text-align: right;
  border-bottom: 1px solid var(--border-grid);
  font-size: 10px;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.panel-edo-table th:first-child { text-align: center; }
.panel-edo-table th:nth-child(2) { text-align: left; }
.panel-edo-table th.sort-asc::after { content: ' ▲'; font-size: 8px; }
.panel-edo-table th.sort-desc::after { content: ' ▼'; font-size: 8px; }
.panel-edo-table th:hover { color: var(--text); }
.panel-edo-table td {
  padding: 2px 6px;
  border-bottom: 1px solid var(--border-section);
  font-family: monospace;
  text-align: right;
  white-space: nowrap;
}
.panel-edo-table td:first-child { text-align: center; }
.panel-edo-table td:nth-child(2) { text-align: left; }
.panel-edo-table .edo-play-btn {
  background: var(--bg-btn-play);
  border: 1px solid var(--border-grid);
  border-radius: 3px;
  color: var(--accent-green);
  font-size: 11px;
  width: 22px;
  height: 18px;
  cursor: pointer;
  padding: 0;
}

// ═══════════════════════════════════════════

function gcd(a, b) { while (b) { [a, b] = [b, a % b]; } return a; }
function gcd3(a, b, c) { return gcd(gcd(a, b), c); }
function gcdN(arr) { return arr.reduce((a, b) => gcd(a, b)); }
function lcm(a, b) { return (a / gcd(a, b)) * b; }
function ratioToCents(n, d) { return 1200 * Math.log2(n / d); }

function oddLimit(n, d) {
  let g = gcd(n, d);
  n /= g; d /= g;
  while (n % 2 === 0) n /= 2;
  while (d % 2 === 0) d /= 2;
  return Math.max(n, d);
}

function chordOddLimit(p, q, r) {
  return Math.max(oddLimit(q, p), oddLimit(r, q), oddLimit(r, p));
}

function chordComplementKey(p, q, r) {
  const a = p * q, b = p * r, c = q * r;
  const g = gcd3(a, b, c);
  return `${a / g}:${b / g}:${c / g}`;
}

function chordInversionKeys(p, q, r) {
  const voicings = [
    [p, q, r],
    [q, r, 2 * p],
    [r, 2 * p, 2 * q],
  ];
  const keys = [];
  for (const [a, b, c] of voicings) {
    const g = gcd3(a, b, c);
    const key = `${a / g}:${b / g}:${c / g}`;
    if (key !== `${p}:${q}:${r}`) keys.push(key);
  }
  return keys;
}

function mergeStack(stack) {
  if (stack.length === 0) return null;
  if (stack.length === 1) {
    const c = stack[0];
    return {
      ratios: [c.p, c.q, c.r],
      key: c.key,
      pitchCents: [0, c.a, c.F],
    };
  }
  let ratios = [stack[0].p, stack[0].q, stack[0].r];
  for (let i = 1; i < stack.length; i++) {
    const c = stack[i];
    const top = ratios[ratios.length - 1];
    const base = c.p;
    const scaledQ = c.q * top;
    const scaledR = c.r * top;
    for (let j = 0; j < ratios.length; j++) ratios[j] *= base;
    const topScaled = top * base;
    if (!ratios.includes(topScaled)) ratios.push(topScaled);
    if (!ratios.includes(scaledQ)) ratios.push(scaledQ);
    if (!ratios.includes(scaledR)) ratios.push(scaledR);
  }
  ratios.sort((a, b) => a - b);
  const unique = [...new Set(ratios)];
  unique.sort((a, b) => a - b);
  const g = gcdN(unique);
  const reduced = unique.map(v => v / g);
  const root = reduced[0];
  const pitchCents = reduced.map(v => ratioToCents(v, root));
  return {
    ratios: reduced,
    key: reduced.join(':'),
    pitchCents,
  };
}

  const t = FRAME_REGIONS.thresholds;

  }
  return FRAME_REGIONS.names[t.length];
}

  else if (diff > 0) contour = 'bright';
  else contour = 'dark';

  const signedH = contour === 'dark' ? -(H - 1) : (H - 1);
  const region = frameRegion(F);
  const ol = chordOddLimit(p, q, r);

  return {
    p, q, r, key, a, b, F,
    contour, H, signedH, region, ol, product,
    name, genericName, displayName,
    pitchCents: [0, a, F],
    ch, cs, cl, invSqrtOl,
  };
}

// ═══════════════════════════════════════════
// ENUMERATION
// ═══════════════════════════════════════════

function enumerateChords(maxR, frameMin, frameMax, maxOdd) {
  const chords = [];
  for (let p = 1; p <= maxR - 2; p++) {
    for (let q = p + 1; q <= maxR - 1; q++) {
      for (let r = q + 1; r <= maxR; r++) {
        if (gcd3(p, q, r) !== 1) continue;
        const F = ratioToCents(r, p);
        if (F < frameMin || F > frameMax) continue;
        const ol = chordOddLimit(p, q, r);
        if (ol > maxOdd) continue;
        chords.push(computeChord(p, q, r));
      }
    }
  }
  return chords;
}

function enumerateThirdsMode(frameMin, frameMax, maxOdd) {
  const chords = [];
  const seen = new Set();
  for (const [n1, d1] of CURATED_THIRDS) {
    for (const [n2, d2] of CURATED_THIRDS) {
      const pRaw = d1 * d2, qRaw = n1 * d2, rRaw = n1 * n2;
      const g = gcd3(pRaw, qRaw, rRaw);
      const p = pRaw / g, q = qRaw / g, r = rRaw / g;
      if (p >= q || q >= r) continue;
      const key = `${p}:${q}:${r}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const F = ratioToCents(r, p);
      if (F < frameMin || F > frameMax) continue;
      const ol = chordOddLimit(p, q, r);
      if (ol > maxOdd) continue;
      chords.push(computeChord(p, q, r));
    }
  }
  return chords;
}

// ═══════════════════════════════════════════
// EDO APPROXIMATION
// ═══════════════════════════════════════════

function edoApproximate(chord, edoMin, edoMax, maxRmsRel) {
  const results = [];
  for (let n = edoMin; n <= edoMax; n++) {
    const stepSize = 1200 / n;
    const steps = chord.pitchCents.map(c => Math.round(c / stepSize));
    const approxCents = steps.map(s => s * stepSize);
    const errors = chord.pitchCents.map((c, i) => approxCents[i] - c);

    const nNotes = errors.length;
    const mean = errors.reduce((s, e) => s + e, 0) / nNotes;
    const sqSum = errors.reduce((s, e) => { const d = e - mean; return s + d * d; }, 0);
    const rmsCents = Math.sqrt(sqSum / nNotes);
    const rmsRel = (rmsCents / stepSize) * 100;

    if (rmsRel > maxRmsRel) continue;

    results.push({
      edo: n, steps, approxCents, errors,
      meanOffset: mean, rmsCents, rmsRel,
    });
  }
  results.sort((a, b) => a.edo - b.edo);
  return results;
}

// ═══════════════════════════════════════════
// EDO OVERLAY
// ═══════════════════════════════════════════

let edoOverlayTriads = [];
let edoOverlayN = 0;
let hoveredEdoTriad = -1;

function generateEdoTriads(n) {
  const triads = [];
  if (!n || n < 2) return triads;
  const stepSize = 1200 / n;
  for (let x = 1; x < n; x++) {
    for (let y = x + 1; y <= n; y++) {
      if (gcd3(x, y, n) > 1) continue;
      const a = x * stepSize;
      const b = (y - x) * stepSize;
      const F = y * stepSize;
      const diff = a - b;
      let contour;
      if (Math.abs(diff) < 3) contour = 'neutral';
      else if (diff > 0) contour = 'bright';
      else contour = 'dark';
      const H = Math.max(a, b) / Math.min(a, b);
      const signedH = contour === 'dark' ? -(H - 1) : (H - 1);
      triads.push({
        steps: [0, x, y], edo: n,
        a, b, F, contour, H, signedH,
        pitchCents: [0, a, F],
        label: `${n}edo [0,${x},${y}]`,
      });
    }
  }
  return triads;
}

// ═══════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════

let audioCtx = null;
let activeOscillators = [];

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function stopAll() {
  const now = getAudioCtx().currentTime;
  for (const { osc, gain } of activeOscillators) {
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.05);
    osc.stop(now + 0.06);
  }
  activeOscillators = [];
}

function playFreqs(freqs, waveform, arpeggio, duration) {
  stopAll();
  const ctx = getAudioCtx();
  const master = ctx.createGain();
  master.gain.value = 0.30;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.knee.value = 12;
  comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.1;
  comp.connect(master);
  master.connect(ctx.destination);
  if (arpeggio) {
    const arpDelay = 0.12;
    const hold = 0.04;
    const release = 1.2;
    const allFreqs = [];
    for (let oct = 0; oct < 3; oct++) {
      const mul = Math.pow(2, oct);
      for (const f of freqs) allFreqs.push(f * mul);
    }
    allFreqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = waveform || 'triangle';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(comp);
      const t = ctx.currentTime + i * arpDelay;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(1, t + 0.01);
      gain.gain.setValueAtTime(1, t + hold);
      gain.gain.exponentialRampToValueAtTime(0.001, t + hold + release);
      osc.start(t);
      osc.stop(t + hold + release + 0.01);
      activeOscillators.push({ osc, gain });
    });
  } else {
    const dur = duration || 1.5;
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = waveform || 'triangle';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(comp);
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(1, t + 0.02);
      gain.gain.setValueAtTime(1, t + dur);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur + 1.5);
      osc.start(t);
      osc.stop(t + dur + 1.51);
      activeOscillators.push({ osc, gain });
    });
  }
}

function playChord(chord, rootHz, waveform, arpeggio) {
  const freqs = [1, chord.q / chord.p, chord.r / chord.p].map(r => rootHz * r);
  playFreqs(freqs, waveform, arpeggio);
}

function playEdoApprox(approx, rootHz, waveform) {
  const freqs = approx.approxCents.map(c => rootHz * Math.pow(2, c / 1200));
  playFreqs(freqs, waveform, false);
}

// ═══════════════════════════════════════════
// CONTINUOUS PLAY (click-drag on grid)
// ═══════════════════════════════════════════

let contPlayState = null;

function positionToFreqs(F, sH, rootHz) {
  let a, b;
  if (sH >= 0) {
    a = F * (sH + 1) / (sH + 2);
    b = F / (sH + 2);
  } else {
    a = F / (2 - sH);
    b = F * (1 - sH) / (2 - sH);
  }
  return [
    rootHz,
    rootHz * Math.pow(2, a / 1200),
    rootHz * Math.pow(2, F / 1200),
  ];
}

function contPlayStart(F, sH, rootHz, waveform) {
  contPlayStop();
  const ctx = getAudioCtx();
  const master = ctx.createGain();
  master.gain.value = 0.30;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.knee.value = 12;
  comp.ratio.value = 12; comp.attack.value = 0.003; comp.release.value = 0.1;
  comp.connect(master);
  master.connect(ctx.destination);

  const freqs = positionToFreqs(F, sH, rootHz);
  const oscs = freqs.map(f => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = waveform || 'triangle';
    osc.frequency.value = f;
    osc.connect(gain);
    gain.connect(comp);
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(1, t + 0.02);
    osc.start(t);
    return { osc, gain };
  });

  contPlayState = { oscs, master, comp };
}

function contPlayUpdate(F, sH, rootHz) {
  if (!contPlayState) return;
  const freqs = positionToFreqs(F, sH, rootHz);
  const now = getAudioCtx().currentTime;
  for (let i = 0; i < contPlayState.oscs.length; i++) {
    contPlayState.oscs[i].osc.frequency.setTargetAtTime(freqs[i], now, 0.03);
  }
}

function contPlayStop() {
  if (!contPlayState) return;
  const now = getAudioCtx().currentTime;
  for (const { osc, gain } of contPlayState.oscs) {
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(gain.gain.value, now);
    gain.gain.linearRampToValueAtTime(0, now + 0.08);
    osc.stop(now + 0.1);
  }
  contPlayState = null;
}

function positionToRootHz() {
  return synthRootHz;
}

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════

let allChords = [];
let filteredChords = [];
let selectedChordKey = null;
let selectedInversionKeys = new Set();
let hoveredIdx = -1;
let synthRootHz = 220;
let synthWaveform = 'triangle';

let chordStack = [];
let stackedChordKeys = new Set();

// ═══════════════════════════════════════════
// VIEW / ZOOM / PAN
// ═══════════════════════════════════════════

const canvas = document.getElementById('plot-canvas');
const plotCtx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let W = 0, H = 0;

const PADDING = { top: 30, right: 30, bottom: 50, left: 60 };

// rAF coalescing — prevents multiple redraws per frame
let _rafPending = false;
let _rafResize = false;
function scheduleRedraw(shouldResize) {
  if (shouldResize) _rafResize = true;
  if (_rafPending) return;
  _rafPending = true;
  requestAnimationFrame(() => {
    _rafPending = false;
    const resize = _rafResize;
    _rafResize = false;
    drawPlot(resize);
  });
}

// Aura sprite cache — one offscreen canvas per unique (h,s,l) triple
const _auraCache = new Map();
const _auraSpriteSize = 128;
function getAuraSprite(h, s, l) {
  const key = (h << 16) | (s << 8) | l;
  let sprite = _auraCache.get(key);
  if (sprite) return sprite;
  const size = _auraSpriteSize;
  const off = new OffscreenCanvas(size * 2, size * 2);
  const octx = off.getContext('2d');
  const grad = octx.createRadialGradient(size, size, 0, size, size, size);
  grad.addColorStop(0, `hsla(${h},${s}%,${l}%,1)`);
  grad.addColorStop(0.15, `hsla(${h},${s}%,${l}%,0.6)`);
  grad.addColorStop(0.4, `hsla(${h},${s}%,${l}%,0.25)`);
  grad.addColorStop(0.7, `hsla(${h},${s}%,${l}%,0.07)`);
  grad.addColorStop(1, `hsla(${h},${s}%,${l}%,0)`);
  octx.fillStyle = grad;
  octx.fillRect(0, 0, size * 2, size * 2);
  _auraCache.set(key, off);
  return off;
}

// Cached draw-pass data for hover reuse
let _visNodeCache = null;

let viewFrameMin, viewFrameMax, viewSignedMin, viewSignedMax;
let homeFrameMin, homeFrameMax, homeSignedMin, homeSignedMax;
let refArea = 9600;

function computeViewBounds() {
  viewFrameMin = 550;
  viewFrameMax = 850;
  viewSignedMin = -4;
  viewSignedMax = 4;
  homeFrameMin = viewFrameMin;
  homeFrameMax = viewFrameMax;
  homeSignedMin = viewSignedMin;
  homeSignedMax = viewSignedMax;

  if (filteredChords.length > 0) {
    let fMin = Infinity, fMax = -Infinity, sMax = 0;
    for (const c of filteredChords) {
      if (c.F < fMin) fMin = c.F;
      if (c.F > fMax) fMax = c.F;
      if (Math.abs(c.signedH) > sMax) sMax = Math.abs(c.signedH);
    }
    refArea = (fMax - fMin + 20) * (sMax * 2 + 0.2);
  }
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = rect.width * dpr;
  H = rect.height * dpr;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
}

function plotX(F) {
  return PADDING.left * dpr + (F - viewFrameMin) / (viewFrameMax - viewFrameMin) * (W - (PADDING.left + PADDING.right) * dpr);
}

function plotY(sH) {
  return PADDING.top * dpr + (1 - (sH - viewSignedMin) / (viewSignedMax - viewSignedMin)) * (H - (PADDING.top + PADDING.bottom) * dpr);
}

function canvasToFrame(cx) {
  return viewFrameMin + (cx * dpr - PADDING.left * dpr) / (W - (PADDING.left + PADDING.right) * dpr) * (viewFrameMax - viewFrameMin);
}

function canvasToSigned(cy) {
  return viewSignedMax - (cy * dpr - PADDING.top * dpr) / (H - (PADDING.top + PADDING.bottom) * dpr) * (viewSignedMax - viewSignedMin);
}

// ── Zoom (scroll) ──
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  const focusF = canvasToFrame(cx);
  const focusS = canvasToSigned(cy);

  const zoomFactor = e.deltaY > 0 ? 1.15 : 1 / 1.15;

  const fRange = viewFrameMax - viewFrameMin;
  const sRange = viewSignedMax - viewSignedMin;

  const ratioF = (focusF - viewFrameMin) / fRange;
  const ratioS = (focusS - viewSignedMin) / sRange;

  const newFRange = fRange * zoomFactor;
  const newSRange = sRange * zoomFactor;

  viewFrameMin = focusF - ratioF * newFRange;
  viewFrameMax = focusF + (1 - ratioF) * newFRange;

  viewSignedMin = focusS - ratioS * newSRange;
  viewSignedMax = focusS + (1 - ratioS) * newSRange;

  scheduleRedraw(false);
}, { passive: false });

// ── Pan (drag) & Y-axis zoom drag ──
let isDragging = false;
let isYAxisDrag = false;
let dragStartX = 0, dragStartY = 0;
let dragStartFrameMin = 0, dragStartFrameMax = 0;
let dragStartSignedMin = 0, dragStartSignedMax = 0;

let isContPlaying = false;
let contPlayDragged = false;
let contPlayStartPos = null;
let contPlayCursorF = 0;
let contPlayCursorSH = 0;

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  if (e.button === 1 || (e.button === 0 && e.altKey)) {
    e.preventDefault();
    if (cx < PADDING.left && cy >= PADDING.top && cy <= rect.height - PADDING.bottom) {
      isYAxisDrag = true;
      dragStartY = e.clientY;
      dragStartSignedMin = viewSignedMin;
      dragStartSignedMax = viewSignedMax;
      canvas.style.cursor = 'ns-resize';
      return;
    }
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartFrameMin = viewFrameMin;
    dragStartFrameMax = viewFrameMax;
    dragStartSignedMin = viewSignedMin;
    dragStartSignedMax = viewSignedMax;
    canvas.style.cursor = 'grabbing';
    return;
  }

  if (e.button !== 0) return;

  if (cx < PADDING.left && cy >= PADDING.top && cy <= rect.height - PADDING.bottom) {
    isYAxisDrag = true;
    dragStartY = e.clientY;
    dragStartSignedMin = viewSignedMin;
    dragStartSignedMax = viewSignedMax;
    canvas.style.cursor = 'ns-resize';
    e.preventDefault();
    return;
  }

  const inPlot = cx >= PADDING.left && cx <= rect.width - PADDING.right &&
                 cy >= PADDING.top && cy <= rect.height - PADDING.bottom;
  if (!inPlot) return;

  const F = canvasToFrame(cx);
  const sH = canvasToSigned(cy);
  const idx = findNearestChord(cx, cy);
  if (idx >= 0) return;

  contPlayStartPos = { x: e.clientX, y: e.clientY };
  contPlayCursorF = F;
  contPlayCursorSH = sH;
  contPlayDragged = false;

  const rootHz = positionToRootHz();
  stopAll();
  contPlayStart(F, sH, rootHz, synthWaveform);
  isContPlaying = true;
  canvas.style.cursor = 'crosshair';
});

window.addEventListener('mousemove', (e) => {
  if (isYAxisDrag) {
    const dy = e.clientY - dragStartY;
    const rect = canvas.getBoundingClientRect();
    const plotH = rect.height - PADDING.top - PADDING.bottom;
    const scale = Math.pow(2, dy / plotH);
    const sRange = dragStartSignedMax - dragStartSignedMin;
    const center = (dragStartSignedMax + dragStartSignedMin) / 2;
    const newRange = sRange * scale;
    viewSignedMin = center - newRange / 2;
    viewSignedMax = center + newRange / 2;
    scheduleRedraw(false);
    return;
  }
  if (isContPlaying) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const F = canvasToFrame(cx);
    const sH = canvasToSigned(cy);
    contPlayCursorF = F;
    contPlayCursorSH = sH;
    const rootHz = positionToRootHz();

    contPlayUpdate(F, sH, rootHz);
    contPlayDragged = true;

    let lower, upper;
    if (sH >= 0) {
      lower = F * (sH + 1) / (sH + 2);
      upper = F / (sH + 2);
    } else {
      lower = F / (2 - sH);
      upper = F * (1 - sH) / (2 - sH);
    }
    const H = Math.max(lower, upper) / Math.min(lower, upper);

    const hitIdx = findNearestChord(cx, cy);
    if (hitIdx >= 0 && filteredChords[hitIdx].key !== selectedChordKey) {
      const hitChord = filteredChords[hitIdx];
      selectedChordKey = hitChord.key;
      selectedInversionKeys = new Set(chordInversionKeys(hitChord.p, hitChord.q, hitChord.r));
      showPanel(hitChord);
    }

    if (document.getElementById('panel-roll-canvas')) {
      drawPianoRoll([0, lower, F]);
    }

    const tooltip = document.getElementById('tooltip');
    tooltip.innerHTML = `
      <div class="tt-detail">root <span style="color:var(--accent-green)">${rootHz.toFixed(1)} Hz</span></div>
      <div class="tt-detail">lower <span>${lower.toFixed(1)}¢</span> · upper <span>${upper.toFixed(1)}¢</span></div>
      <div class="tt-detail">frame <span style="color:var(--accent-bright)">${F.toFixed(1)}¢</span> · hardness <span style="color:var(--accent-purple)">${H.toFixed(3)}</span></div>
    `;
    tooltip.style.display = 'block';
    let tx = e.clientX + 14, ty = e.clientY - 10;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    if (tx + tw > window.innerWidth - 8) tx = e.clientX - tw - 14;
    if (ty + th > window.innerHeight - 8) ty = e.clientY - th - 10;
    if (ty < 4) ty = 4;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
    return;
  }
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;

  const rect = canvas.getBoundingClientRect();
  const plotW = rect.width - PADDING.left - PADDING.right;
  const plotH = rect.height - PADDING.top - PADDING.bottom;

  const fRange = dragStartFrameMax - dragStartFrameMin;
  const sRange = dragStartSignedMax - dragStartSignedMin;

  const dF = -dx / plotW * fRange;
  const dS = dy / plotH * sRange;

  viewFrameMin = dragStartFrameMin + dF;
  viewFrameMax = dragStartFrameMax + dF;
  viewSignedMin = dragStartSignedMin + dS;
  viewSignedMax = dragStartSignedMax + dS;

  scheduleRedraw(false);
});

window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    canvas.style.cursor = 'default';
  }
  if (isYAxisDrag) {
    isYAxisDrag = false;
    canvas.style.cursor = 'default';
  }
  if (isContPlaying) {
    isContPlaying = false;
    contPlayStop();
    document.getElementById('tooltip').style.display = 'none';
    drawPlot(false);
  }
});

// ── Reset view ──
document.getElementById('btn-reset-view').addEventListener('click', () => {
  viewFrameMin = homeFrameMin;
  viewFrameMax = homeFrameMax;
  viewSignedMin = homeSignedMin;
  viewSignedMax = homeSignedMax;
  drawPlot(false);
});

// ═══════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════

function drawPlot(shouldResize) {
  if (shouldResize !== false) resizeCanvas();
  const ctx = plotCtx;
  const tc = getThemeColors();
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = tc.canvasBg;
  ctx.fillRect(0, 0, W, H);

  const pL = PADDING.left * dpr, pR = PADDING.right * dpr;
  const pT = PADDING.top * dpr, pB = PADDING.bottom * dpr;
  const plotW = W - pL - pR;
  const plotH = H - pT - pB;

  // Half-shading
  const yCenter = plotY(0);
  const yTop = Math.max(pT, Math.min(H - pB, yCenter));
  const yBot = Math.max(pT, Math.min(H - pB, yCenter));
  if (yCenter > pT && yCenter < H - pB) {
    ctx.fillStyle = tc.brightTint;
    ctx.fillRect(pL, pT, plotW, yCenter - pT);
    ctx.fillStyle = tc.darkTint;
    ctx.fillRect(pL, yCenter, plotW, H - pB - yCenter);
  } else if (yCenter <= pT) {
    ctx.fillStyle = tc.darkTint;
    ctx.fillRect(pL, pT, plotW, plotH);
  } else {
    ctx.fillStyle = tc.brightTint;
    ctx.fillRect(pL, pT, plotW, plotH);
  }

  // Region bands
  const thresholds = [viewFrameMin, ...FRAME_REGIONS.thresholds, viewFrameMax];
  for (let i = 0; i < FRAME_REGIONS.names.length; i++) {
    const left = Math.max(thresholds[i], viewFrameMin);
    const right = Math.min(thresholds[i + 1], viewFrameMax);
    if (left >= viewFrameMax || right <= viewFrameMin) continue;
    const x0 = plotX(left), x1 = plotX(right);
    ctx.fillStyle = REGION_BAND_COLORS[i];
    ctx.fillRect(x0, pT, x1 - x0, plotH);

    ctx.save();
    ctx.font = `${11 * dpr}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = tc.regionLabel;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(FRAME_REGIONS.names[i], (x0 + x1) / 2, pT + 4 * dpr);
    ctx.restore();
  }

  // Center axis (signedH = 0)
  if (viewSignedMin <= 0 && viewSignedMax >= 0) {
    const y0 = plotY(0);
    ctx.strokeStyle = tc.axisStroke;
    ctx.lineWidth = 1.5 * dpr;
    ctx.beginPath();
    ctx.moveTo(pL, y0);
    ctx.lineTo(W - pR, y0);
    ctx.stroke();

    ctx.font = `${10 * dpr}px 'Segoe UI', system-ui, sans-serif`;
    ctx.fillStyle = tc.axisLabel;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'bottom';
    ctx.fillText('H = 1.0 (equal thirds)', pL + 4 * dpr, y0 - 3 * dpr);
  }

  // Hardness = 2.5 reference lines (plotted at ±1.5 since origin is H=1)
  for (const sH of [1.5, -1.5]) {
    if (viewSignedMin <= sH && viewSignedMax >= sH) {
      const y = plotY(sH);
      ctx.strokeStyle = tc.refStroke;
      ctx.lineWidth = 1 * dpr;
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      ctx.beginPath();
      ctx.moveTo(pL, y);
      ctx.lineTo(W - pR, y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.font = `${9 * dpr}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = tc.refLabel;
      ctx.textAlign = 'right';
      ctx.textBaseline = sH > 0 ? 'bottom' : 'top';
      ctx.fillText('H = 2.5', W - pR - 4 * dpr, y + (sH > 0 ? -2 : 2) * dpr);
    }
  }

  // Bright/dark labels
  const yCenterClamped = Math.max(pT, Math.min(H - pB, plotY(0)));
  ctx.save();
  ctx.font = `bold ${11 * dpr}px 'Segoe UI', system-ui, sans-serif`;
  ctx.textAlign = 'center';
  if (yCenterClamped - pT > 30 * dpr) {
    ctx.fillStyle = tc.brightLabel;
    ctx.textBaseline = 'top';
    ctx.fillText('bright ↑', pL + 30 * dpr, pT + 4 * dpr);
  }
  if (H - pB - yCenterClamped > 30 * dpr) {
    ctx.fillStyle = tc.darkLabel;
    ctx.textBaseline = 'bottom';
    ctx.fillText('dark ↓', pL + 24 * dpr, H - pB - 4 * dpr);
  }
  ctx.restore();

  // Grid
  ctx.strokeStyle = tc.gridStroke;
  ctx.lineWidth = dpr * 0.5;

  const xTicks = niceTicksLinear(viewFrameMin, viewFrameMax, 16);
  for (const v of xTicks) {
    const x = plotX(v);
    if (x < pL || x > W - pR) continue;
    ctx.beginPath(); ctx.moveTo(x, pT); ctx.lineTo(x, H - pB); ctx.stroke();
  }

  const yTicksAll = niceTicksLinear(viewSignedMin, viewSignedMax, 8);

  for (const v of yTicksAll) {
    const y = plotY(v);
    if (y < pT || y > H - pB || Math.abs(v) < 0.001) continue;
    ctx.beginPath(); ctx.moveTo(pL, y); ctx.lineTo(W - pR, y); ctx.stroke();
  }

  // X tick labels
  ctx.font = `${11 * dpr}px monospace`;
  ctx.fillStyle = tc.textMuted;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (const v of xTicks) {
    const x = plotX(v);
    if (x < pL || x > W - pR) continue;
    ctx.fillText(v.toFixed(1), x, H - pB + 6 * dpr);
  }

  // Y tick labels
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const v of yTicksAll) {
    const y = plotY(v);
    if (y < pT || y > H - pB || Math.abs(v) < 0.001) continue;
    ctx.fillStyle = v > 0 ? tc.brightTick : tc.darkTick;
    ctx.fillText((Math.abs(v) + 1).toFixed(2), pL - 6 * dpr, y);
  }

  // Axis titles
  ctx.font = `${12 * dpr}px 'Segoe UI', system-ui, sans-serif`;
  ctx.fillStyle = tc.textDim;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('Frame (¢)', pL + plotW / 2, H - 14 * dpr);

  ctx.save();
  ctx.translate(16 * dpr, pT + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle';
  ctx.fillText('Hardness', 0, 0);
  ctx.restore();

  // Plot border
  ctx.strokeStyle = tc.border;
  ctx.lineWidth = dpr;
  ctx.strokeRect(pL, pT, plotW, plotH);

  // Nodes — two-pass: auras first, then dots on top
  const viewFRange = viewFrameMax - viewFrameMin;
  const viewSRange = viewSignedMax - viewSignedMin;
  const viewArea = viewFRange * viewSRange;
  const zoomRatio = refArea / Math.max(viewArea, 0.01);

  // Pre-compute visible nodes (reused by hover detection)
  const hasSearch = document.getElementById('flt-search').value.trim() !== '' ||
                    document.getElementById('flt-steps').value.trim() !== '';
  const reveal = +document.getElementById('flt-reveal').value;
  const revealScale = 0.2 + 1.8 * ((100 - reveal) / 100);
  const threshold = 3.75 + 1.8 * Math.pow(zoomRatio, 0.46) * revealScale;
  const fadeRange = Math.max(threshold * 2.75, 7.5);
  const fadeEnd = threshold + fadeRange;

  // Inline plotX/plotY coefficient
  const xScale = (W - pL - pR) / (viewFrameMax - viewFrameMin);
  // Dot/aura sizes grow at 1/3 zoom rate: cube-root scaling normalized to default view
  const refXScale = (W - pL - pR) / (homeFrameMax - homeFrameMin);
  const dotScale = refXScale * Math.pow(xScale / refXScale, 1 / 3);

  const visNodes = [];
  for (let i = 0; i < filteredChords.length; i++) {
    const c = filteredChords[i];
    const isSelected = c.key === selectedChordKey;
    const isInversion = selectedInversionKeys.has(c.key);
    const isStacked = stackedChordKeys.has(c.key);
    let vis;
    if (isSelected || isInversion || isStacked || hasSearch) {
      vis = 1;
    } else if (c.ol <= threshold) {
      vis = 1;
    } else if (c.ol > fadeEnd) {
      continue;
    } else {
      const t = (c.ol - threshold) / fadeRange;
      vis = Math.pow(1 - t, 3.5);
      if (vis <= 0) continue;
    }
    const x = pL + (c.F - viewFrameMin) * xScale;
    const y = pT + (1 - (c.signedH - viewSignedMin) / (viewSignedMax - viewSignedMin)) * (H - pT - pB);
    const dotWorldR = 0.85 * Math.max(0.6, 3 * c.invSqrtOl);
    const auraR = dotWorldR * dotScale * 6 * vis;
    if (x < pL - auraR || x > W - pR + auraR || y < pT - auraR || y > H - pB + auraR) continue;
    visNodes.push({ i, c, x, y, vis, auraR, isSelected, isInversion, isStacked });
  }

  // Proximity declutter: shrink/fade nodes crowded by a more important neighbor
  // Use refXScale (home zoom) for clutter radius so suppression is zoom-invariant
  visNodes.sort((a, b) => a.c.ol - b.c.ol);
  for (let j = 0; j < visNodes.length; j++) {
    const n = visNodes[j];
    if (n.isSelected || n.isInversion || n.isStacked) continue;
    for (let k = 0; k < j; k++) {
      const m = visNodes[k];
      if (m.c.ol >= n.c.ol) continue;
      const dF = n.c.F - m.c.F;
      const dS = n.c.signedH - m.c.signedH;
      const mScale = Math.max(0.6, 3 * m.c.invSqrtOl);
      const clutterCents = mScale * 25;
      const clutterS = clutterCents / 200;
      const normF = dF / clutterCents;
      const normS = dS / clutterS;
      const d2 = normF * normF + normS * normS;
      if (d2 < 1) {
        const proximity = 1 - Math.sqrt(d2);
        const importance = Math.min(1, (n.c.ol - m.c.ol) / m.c.ol);
        const suppress = proximity * importance;
        n.vis *= (1 - suppress * 0.7);
        n.auraR *= (1 - suppress * 0.5);
      }
    }
  }

  // Cache for hover reuse
  _visNodeCache = { visNodes, zoomRatio, hasSearch, reveal };

  // Sort by color to minimize fillStyle/strokeStyle state changes
  visNodes.sort((a, b) => {
    const ac = a.c, bc = b.c;
    return (ac.ch - bc.ch) || (ac.cs - bc.cs) || (ac.cl - bc.cl) || (a.vis - b.vis);
  });

  const nodeCount = visNodes.length;
  const auraLimit = 300;
  const skipAuras = nodeCount > auraLimit;
  const skipRings = nodeCount > 600;

  // Pass 1: auras (skip when too many nodes — they just blend into mush)
  const auraHueShift = tc.hueShift;
  const auraSatScale = tc.satScale;
  if (!skipAuras) {
    for (const n of visNodes) {
      const c = n.c;
      const alpha = n.vis * 0.9;
      const auraAlpha = alpha * Math.min(0.6, 5 / c.ol);
      const ah = ((c.ch + auraHueShift) % 360 + 360) % 360;
      const as = Math.max(0, Math.min(100, c.cs * auraSatScale));
      const sprite = getAuraSprite(ah | 0, as | 0, c.cl | 0);
      const size = n.auraR * 2;
      ctx.globalAlpha = auraAlpha;
      ctx.drawImage(sprite, n.x - n.auraR, n.y - n.auraR, size, size);
    }
    ctx.globalAlpha = 1;
  } else {
    for (const n of visNodes) {
      if (!n.isSelected && !n.isInversion && !n.isStacked && n.i !== hoveredIdx && n.c.ol > 15) continue;
      const c = n.c;
      const alpha = n.vis * 0.9;
      const auraAlpha = alpha * Math.min(0.6, 5 / c.ol);
      const ah = ((c.ch + auraHueShift) % 360 + 360) % 360;
      const as = Math.max(0, Math.min(100, c.cs * auraSatScale));
      const sprite = getAuraSprite(ah | 0, as | 0, c.cl | 0);
      const size = n.auraR * 2;
      ctx.globalAlpha = auraAlpha;
      ctx.drawImage(sprite, n.x - n.auraR, n.y - n.auraR, size, size);
    }
    ctx.globalAlpha = 1;
  }

  // Pass 2: dots, rings, labels
  const TWO_PI = Math.PI * 2;
  const ringWidth = 0.75 * dpr;
  const hueShift = tc.hueShift;
  const satScale = tc.satScale;
  let lastFill = '', lastStroke = '';
  for (const n of visNodes) {
    const h = (n.c.ch + hueShift + 360) % 360;
    const s = Math.max(0, Math.min(100, n.c.cs * satScale));
    const l = n.c.cl;
    const isHovered = n.i === hoveredIdx;
    const alpha = n.vis * 0.9;

    const complexScale = Math.max(0.6, 3 * n.c.invSqrtOl);
    const visScale = 0.15 + 0.85 * n.vis;
    const worldR = 0.85 * complexScale * visScale;
    const dotR = worldR * dotScale;

    // Filled core
    const fill = `hsla(${h},${s}%,${l}%,${alpha})`;
    if (fill !== lastFill) { ctx.fillStyle = fill; lastFill = fill; }
    ctx.beginPath();
    ctx.arc(n.x, n.y, dotR, 0, TWO_PI);
    ctx.fill();

    // Edge ring — skip when there are tons of nodes and dot is small
    if (!skipRings || dotR > 3 * dpr || isHovered || n.isSelected || n.isInversion || n.isStacked) {
      const stroke = `hsla(${h},${s}%,${Math.min(95, l + 25)}%,${alpha * 0.5})`;
      if (stroke !== lastStroke) { ctx.strokeStyle = stroke; lastStroke = stroke; }
      ctx.lineWidth = ringWidth;
      ctx.beginPath();
      ctx.arc(n.x, n.y, dotR, 0, TWO_PI);
      ctx.stroke();
    }

    if (n.isSelected) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, dotR + 4 * dpr, 0, TWO_PI);
      ctx.strokeStyle = tc.accent;
      ctx.lineWidth = 1.5 * dpr;
      ctx.stroke();
      lastStroke = '';
    } else if (n.isStacked) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, dotR + 4 * dpr, 0, TWO_PI);
      ctx.strokeStyle = tc.accentGreen;
      ctx.lineWidth = 1.5 * dpr;
      ctx.stroke();
      lastStroke = '';
    } else if (n.isInversion) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, dotR + 4 * dpr, 0, TWO_PI);
      ctx.strokeStyle = tc.accent + '88';
      ctx.lineWidth = 1.5 * dpr;
      ctx.setLineDash([3 * dpr, 3 * dpr]);
      ctx.stroke();
      ctx.setLineDash([]);
      lastStroke = '';
    } else if (isHovered) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, dotR + 3 * dpr, 0, TWO_PI);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1 * dpr;
      ctx.stroke();
      lastStroke = '';
    }

    if (isHovered || n.isSelected || n.isInversion || n.isStacked) {
      ctx.font = `bold ${11 * dpr}px monospace`;
      ctx.fillStyle = tc.text;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(n.c.key, n.x + dotR + 4 * dpr, n.y - 2 * dpr);
      lastFill = '';
    }
  }

  // EDO overlay triads
  if (edoOverlayTriads.length > 0) {
    ctx.font = `${9 * dpr}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < edoOverlayTriads.length; i++) {
      const t = edoOverlayTriads[i];
      const x = plotX(t.F);
      const y = plotY(t.signedH);
      if (x < pL - 10 * dpr || x > W - pR + 10 * dpr || y < pT - 6 * dpr || y > H - pB + 6 * dpr) continue;
      const isHov = i === hoveredEdoTriad;
      ctx.fillStyle = isHov ? '#ffffff' : hexWithAlpha(tc.accentGreen, 0.7);
      ctx.fillText(t.edo, x, y);

      if (isHov) {
        ctx.font = `bold ${11 * dpr}px monospace`;
        ctx.fillStyle = tc.accentGreen;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        ctx.fillText(t.label, x + 10 * dpr, y - 2 * dpr);
        ctx.font = `${9 * dpr}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
      }
    }
  }

  if (isContPlaying && contPlayDragged) {
    const cursorX = plotX(contPlayCursorF);
    const cursorY = plotY(contPlayCursorSH);

    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath();
    ctx.moveTo(cursorX, Math.max(pT, cursorY - 12 * dpr));
    ctx.lineTo(cursorX, Math.min(H - pB, cursorY + 12 * dpr));
    ctx.moveTo(Math.max(pL, cursorX - 12 * dpr), cursorY);
    ctx.lineTo(Math.min(W - pR, cursorX + 12 * dpr), cursorY);
    ctx.stroke();
    ctx.restore();
  }
}



function hexWithAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function niceTicksLinear(min, max, approxCount) {
  const range = max - min;
  if (range <= 0) return [min];
  const rawStep = range / approxCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  let step;
  const norm = rawStep / mag;
  if (norm < 1.5) step = mag;
  else if (norm < 3.5) step = 2 * mag;
  else if (norm < 7.5) step = 5 * mag;
  else step = 10 * mag;
  const start = Math.ceil(min / step) * step;
  const ticks = [];
  for (let v = start; v <= max + step * 0.01; v += step) {
    ticks.push(Math.round(v * 1e6) / 1e6);
  }
  return ticks;
}

// ═══════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════

function findNearestChord(cx, cy) {
  if (!_visNodeCache) return -1;
  const mx = cx * dpr, my = cy * dpr;
  let bestIdx = -1, bestDist = Infinity;
  const { visNodes } = _visNodeCache;
  const pL = PADDING.left * dpr, pR = PADDING.right * dpr;
  const hitXScale = (W - pL - pR) / (viewFrameMax - viewFrameMin);
  const hitRefXScale = (W - pL - pR) / (homeFrameMax - homeFrameMin);
  const hitDotScale = hitRefXScale * Math.pow(hitXScale / hitRefXScale, 1 / 3);
  for (let j = 0; j < visNodes.length; j++) {
    const n = visNodes[j];
    if (n.vis < 0.15) continue;
    const dx = mx - n.x, dy = my - n.y;
    const d2 = dx * dx + dy * dy;
    const complexScale = Math.max(0.6, 3 * n.c.invSqrtOl);
    const visScale = 0.15 + 0.85 * n.vis;
    const worldR = 0.85 * complexScale * visScale;
    const dotR = worldR * hitDotScale;
    const hitR = Math.max(dotR + 4 * dpr, 8 * dpr * visScale);
    if (d2 < hitR * hitR && d2 < bestDist) {
      bestDist = d2;
      bestIdx = n.i;
    }
  }
  return bestIdx;
}

function findNearestEdoTriad(cx, cy) {
  if (edoOverlayTriads.length === 0) return -1;
  const mx = cx * dpr, my = cy * dpr;
  let bestIdx = -1, bestDist = Infinity;
  const hitR = 8 * dpr;
  for (let i = 0; i < edoOverlayTriads.length; i++) {
    const t = edoOverlayTriads[i];
    const x = plotX(t.F);
    const y = plotY(t.signedH);
    const dx = mx - x, dy = my - y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < hitR && dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  }
  return bestIdx;
}

canvas.addEventListener('mousemove', (e) => {
  if (isDragging || isYAxisDrag || isContPlaying) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  if (cx < PADDING.left && cy >= PADDING.top && cy <= rect.height - PADDING.bottom) {
    canvas.style.cursor = 'ns-resize';
    if (hoveredIdx !== -1 || hoveredEdoTriad !== -1) { hoveredIdx = -1; hoveredEdoTriad = -1; drawPlot(false); }
    document.getElementById('tooltip').style.display = 'none';
    return;
  }

  const idx = findNearestChord(cx, cy);
  const edoIdx = idx < 0 ? findNearestEdoTriad(cx, cy) : -1;

  if (idx !== hoveredIdx || edoIdx !== hoveredEdoTriad) {
    hoveredIdx = idx;
    hoveredEdoTriad = edoIdx;
    drawPlot(false);
  }

  const tooltip = document.getElementById('tooltip');
  if (idx >= 0) {
    const c = filteredChords[idx];
    canvas.style.cursor = 'pointer';
    const inStack = stackedChordKeys.has(c.key);
    const stackHint = chordStack.length > 0 ? (inStack ? '<div class="tt-detail" style="color:var(--accent-green)">in stack</div>' : '<div class="tt-detail" style="color:var(--accent-green)">shift+click to stack</div>') : '<div class="tt-detail" style="color:var(--text-faint)">shift+click to start stacking</div>';
    tooltip.innerHTML = `
      <div class="tt-ratio">${c.key}</div>${c.displayName ? `
      <div class="tt-name">${c.displayName}</div>` : ''}
      <div class="tt-detail">lower <span>${c.a.toFixed(1)}¢</span> · upper <span>${c.b.toFixed(1)}¢</span></div>
      <div class="tt-detail">frame <span style="color:var(--accent-bright)">${c.F.toFixed(1)}¢</span> · hardness <span style="color:var(--accent-purple)">${c.H.toFixed(3)}</span></div>
      <div class="tt-detail">odd-limit <span style="color:var(--accent-green)">${c.ol}</span></div>
      ${stackHint}
    `;
    tooltip.style.display = 'block';
  } else if (edoIdx >= 0) {
    const t = edoOverlayTriads[edoIdx];
    canvas.style.cursor = 'pointer';
    tooltip.innerHTML = `
      <div class="tt-ratio" style="color:var(--accent-green)">${t.label}</div>
      <div class="tt-detail">steps <span style="color:var(--accent-green)">${t.steps.join('–')}</span></div>
      <div class="tt-detail">lower <span>${t.a.toFixed(1)}¢</span> · upper <span>${t.b.toFixed(1)}¢</span></div>
      <div class="tt-detail">frame <span style="color:var(--accent-bright)">${t.F.toFixed(1)}¢</span> · hardness <span style="color:var(--accent-purple)">${t.H.toFixed(3)}</span></div>
    `;
    tooltip.style.display = 'block';
  } else {
    canvas.style.cursor = 'crosshair';
    tooltip.style.display = 'none';
  }

  if (tooltip.style.display === 'block') {
    let tx = e.clientX + 14, ty = e.clientY - 10;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    if (tx + tw > window.innerWidth - 8) tx = e.clientX - tw - 14;
    if (ty + th > window.innerHeight - 8) ty = e.clientY - th - 10;
    if (ty < 4) ty = 4;
    tooltip.style.left = tx + 'px';
    tooltip.style.top = ty + 'px';
  }
});

canvas.addEventListener('mouseleave', () => {
  if (!isDragging) {
    hoveredIdx = -1;
    hoveredEdoTriad = -1;
    drawPlot(false);
    document.getElementById('tooltip').style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('click', (e) => {
  if (isDragging) return;
  if (contPlayStartPos) {
    const dx = e.clientX - contPlayStartPos.x;
    const dy = e.clientY - contPlayStartPos.y;
    const wasDrag = Math.sqrt(dx * dx + dy * dy) > 5;
    contPlayStartPos = null;
    if (wasDrag) return;
  }
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const idx = findNearestChord(cx, cy);
  if (idx >= 0) {
    if (e.shiftKey) {
      stackChord(idx);
    } else {
      chordStack = [];
      stackedChordKeys = new Set();
      selectChord(idx);
    }
  } else {
    const ei = findNearestEdoTriad(cx, cy);
    if (ei >= 0) {
      const t = edoOverlayTriads[ei];
      const freqs = t.pitchCents.map(c => synthRootHz * Math.pow(2, c / 1200));
      playFreqs(freqs, synthWaveform, false);
    }
  }
});

canvas.addEventListener('auxclick', (e) => { if (e.button === 1) e.preventDefault(); });

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
  const idx = findNearestChord(cx, cy);
  if (idx >= 0) {
    playChord(filteredChords[idx], synthRootHz, synthWaveform, true);
  } else {
    const ei = findNearestEdoTriad(cx, cy);
    if (ei >= 0) {
      const t = edoOverlayTriads[ei];
      const freqs = t.pitchCents.map(c => synthRootHz * Math.pow(2, c / 1200));
      playFreqs(freqs, synthWaveform, true);
    }
  }
});

window.addEventListener('resize', () => scheduleRedraw(true));
new ResizeObserver(() => scheduleRedraw(true)).observe(canvas.parentElement);

// ═══════════════════════════════════════════
// BOTTOM INFO PANEL

let selectedChordIdx = -1;

function selectChord(idx) {
  selectedChordIdx = idx;
  const c = filteredChords[idx];
  if (!c) return;

  selectedChordKey = c.key;
  selectedInversionKeys = new Set(chordInversionKeys(c.p, c.q, c.r));
  history.replaceState(null, '', '#' + c.key);
  playChord(c, synthRootHz, synthWaveform, false);
  showPanel(c);
  drawPlot();
}

function stackChord(idx) {
  const c = filteredChords[idx];
  if (!c) return;
  if (stackedChordKeys.has(c.key)) return;

  if (chordStack.length === 0 && selectedChordIdx >= 0) {
    const base = filteredChords[selectedChordIdx];
    if (base && base.key !== c.key) {
      chordStack.push(base);
      stackedChordKeys.add(base.key);
    }
  }

  chordStack.push(c);
  stackedChordKeys.add(c.key);

  if (chordStack.length === 1) {
    selectedChordKey = c.key;
    selectedInversionKeys = new Set();
    selectedChordIdx = idx;
    playChord(c, synthRootHz, synthWaveform, false);
    showPanel(c);
    drawPlot();
    return;
  }

  selectedChordKey = null;
  selectedInversionKeys = new Set();
  selectedChordIdx = -1;

  const merged = mergeStack(chordStack);
  if (!merged) return;

  const freqs = merged.ratios.map(r => synthRootHz * (r / merged.ratios[0]));
  playFreqs(freqs, synthWaveform, false);

  history.replaceState(null, '', '#' + merged.key);
  showStackPanel(merged);
  drawPlot();
}

function showStackPanel(merged) {
  const panel = document.getElementById('info-panel');
  const inner = document.getElementById('panel-inner');
  panel.classList.add('open');

  const edoResults = edoApproximate({ pitchCents: merged.pitchCents }, EDO_RANGE.min, EDO_RANGE.max, EDO_MAX_RMS_REL);

  const intervals = [];
  for (let i = 0; i < merged.ratios.length - 1; i++) {
    const lo = merged.ratios[i];
    const hi = merged.ratios[i + 1];
    const g = gcd(hi, lo);
    const cents = merged.pitchCents[i + 1] - merged.pitchCents[i];
    const ol = oddLimit(hi, lo);
    intervals.push({ lo, hi, ratio: `${hi / g}/${lo / g}`, cents, ol });
  }

  const totalSpan = merged.pitchCents[merged.pitchCents.length - 1];
  const maxOl = Math.max(...intervals.map(iv => iv.ol));

  const sourceKeys = chordStack.map(c => c.key).join(' + ');

  function fmtErr(v) { return (v >= 0 ? '+' : '') + v.toFixed(1); }

  const edoRows = edoResults.map((e, ei) => {
    const stepsStr = e.steps.join('–');
    const centsStr = e.approxCents.map(c => c.toFixed(1)).join(', ');
    const errsStr = e.errors.map(fmtErr).join(', ');
    return `<tr data-edo="${e.edo}" data-rms-rel="${e.rmsRel}">
      <td><button class="edo-play-btn" data-ei="${ei}" title="Play in ${e.edo}edo">▶</button></td>
      <td>${e.edo}</td>
      <td>${stepsStr}</td>
      <td>${centsStr}</td>
      <td>${errsStr}</td>
      <td>${e.rmsCents.toFixed(2)}</td>
      <td>${e.rmsRel.toFixed(1)}</td>
    </tr>`;
  }).join('');

  const intervalRows = intervals.map((iv, i) => {
    const colors = ['var(--accent-dark)', 'var(--accent-bright)', 'var(--accent-green)', 'var(--accent-purple)', 'var(--accent)', 'var(--text-dim)', 'var(--text)'];

    return `<div class="panel-row">
      <span class="panel-row-label" style="color:${color}">Step ${i + 1}</span>
      <span class="panel-row-value" style="color:${color}">${iv.ratio}</span>
      <span class="panel-row-value" style="color:var(--accent)">${iv.cents.toFixed(1)}¢</span>
    </div>`;
  }).join('');

  inner.innerHTML = `
    <div class="panel-header-col">
      <div class="panel-ratio">${merged.key}</div>
      <div class="panel-name" style="color:var(--accent-green);font-size:11px">${sourceKeys}</div>
      <div class="panel-audio">
        <label>Hz</label>
        <input type="number" id="p-root" value="${synthRootHz}" min="20" max="2000">
        <select id="p-wave">
          <option value="triangle"${synthWaveform === 'triangle' ? ' selected' : ''}>tri</option>
          <option value="sine"${synthWaveform === 'sine' ? ' selected' : ''}>sin</option>
          <option value="sawtooth"${synthWaveform === 'sawtooth' ? ' selected' : ''}>saw</option>
          <option value="square"${synthWaveform === 'square' ? ' selected' : ''}>sq</option>
        </select>
      </div>
      <div class="panel-audio">
        <button class="panel-play-btn" id="p-play">▶ Play</button>
        <button class="panel-play-btn" id="p-arp">▶ Arp</button>
        <button class="panel-stop-btn" id="p-stop">■</button>

    </div>

    <div class="panel-desc-col">
      <div class="panel-desc-row">

          <div class="panel-section-title">Intervals (${merged.ratios.length} notes)</div>

          <div class="panel-row" style="margin-top:4px">

  });

  document.getElementById('p-wave').addEventListener('change', e => { synthWaveform = e.target.value; });

  const playMerged = (arp) => {
    const a = getAudio();
    const freqs = merged.ratios.map(r => a.rootHz * (r / merged.ratios[0]));
    playFreqs(freqs, a.waveform, arp);
  };

  document.getElementById('p-play').onclick = () => playMerged(false);
  document.getElementById('p-arp').onclick = () => playMerged(true);
  document.getElementById('p-stop').onclick = stopAll;

  inner.querySelectorAll('.edo-play-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = getAudio();
      playEdoApprox(edoResults[+btn.dataset.ei], a.rootHz, a.waveform);
    });
  });

  const edoTable = document.getElementById('edo-approx-table');
  if (edoTable) {
    edoTable.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const tbody = edoTable.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const colIdx = Array.from(th.parentNode.children).indexOf(th);
        const wasAsc = th.classList.contains('sort-asc');
        const dir = wasAsc ? -1 : 1;
        edoTable.querySelectorAll('th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
        th.classList.add(dir === 1 ? 'sort-asc' : 'sort-desc');
        rows.sort((a, b) => {
          const av = parseFloat(a.children[colIdx].textContent);
          const bv = parseFloat(b.children[colIdx].textContent);
          return (av - bv) * dir;
        });
        rows.forEach(r => tbody.appendChild(r));
      });
    });
  }

  requestAnimationFrame(drawPlot);
}

function drawPianoRoll(pitchCents) {
  const rc = document.getElementById('panel-roll-canvas');
  if (!rc) return;
  const rr = rc.parentElement.getBoundingClientRect();
  if (rr.width < 1 || rr.height < 1) return;
  const rd = window.devicePixelRatio || 1;
  rc.width = rr.width * rd;
  rc.height = rr.height * rd;
  const rx = rc.getContext('2d');
  const padL = 10 * rd, padR = 6 * rd, padT = 4 * rd, padB = 14 * rd;
  const pw = rc.width - padL - padR;
  const ph = rc.height - padT - padB;

  const cMin = -20, cMax = Math.max(1200, Math.max(...pitchCents) + 20);
  const cRange = cMax - cMin;
  const cToX = c => padL + ((c - cMin) / cRange) * pw;

  const prc = getThemeColors();
  rx.fillStyle = prc.bgInput;
  rx.fillRect(padL, padT, pw, ph);
  rx.strokeStyle = prc.borderGrid;
  rx.lineWidth = rd;
  rx.strokeRect(padL, padT, pw, ph);

  // Dotted lines at every 100c
  rx.lineWidth = rd * 0.5;
  rx.font = `${7 * rd}px monospace`;
  rx.fillStyle = prc.textFaint;
  rx.textAlign = 'center';
  rx.textBaseline = 'top';
  for (let c = 0; c <= cMax; c += 100) {
    const x = cToX(c);
    if (x < padL || x > padL + pw) continue;
    rx.strokeStyle = prc.borderGrid;
    rx.setLineDash([2 * rd, 3 * rd]);
    rx.beginPath();
    rx.moveTo(x, padT);
    rx.lineTo(x, padT + ph);
    rx.stroke();
    rx.setLineDash([]);
    rx.fillText(c, x, padT + ph + 2 * rd);
  }

  // Chord note bars (vertical bars at each pitch)
  const barW = Math.max(3 * rd, pw * 0.008);
  const colors = [prc.accent, prc.accentDark, prc.accentBright, prc.accentGreen, prc.accentPurple, prc.textDim, prc.text, prc.accentDark, prc.accentBright];
  rx.font = `${8 * rd}px monospace`;
  rx.textBaseline = 'top';
  rx.textAlign = 'center';
  for (let i = 0; i < pitchCents.length; i++) {
    const x = cToX(pitchCents[i]) - barW / 2;
    rx.fillStyle = colors[i % colors.length];
    rx.fillRect(x, padT + 1 * rd, barW, ph - 2 * rd);
    rx.fillText(Math.round(pitchCents[i]), x + barW / 2, padT + ph + 2 * rd);
  }

  // Interval span lines between adjacent notes
  const spanColors = colors.map(c => hexWithAlpha(c, 0.4));
  const spanLabelColors = colors.map(c => hexWithAlpha(c, 0.67));
  rx.lineWidth = rd;
  for (let i = 0; i < pitchCents.length - 1; i++) {
    const x0 = cToX(pitchCents[i]);
    const x1 = cToX(pitchCents[i + 1]);
    const midY = padT + ph * 0.5;
    rx.strokeStyle = spanColors[i % spanColors.length];
    rx.beginPath();
    rx.moveTo(x0, midY);
    rx.lineTo(x1, midY);
    rx.stroke();
    const diff = pitchCents[i + 1] - pitchCents[i];
    rx.fillStyle = spanLabelColors[i % spanLabelColors.length];
    rx.font = `${7 * rd}px monospace`;
    rx.textAlign = 'center';
    rx.textBaseline = 'middle';
    rx.fillText(Math.round(diff) + '¢', (x0 + x1) / 2, midY + 7 * rd);
  }
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  selectedChordKey = null;
  selectedInversionKeys = new Set();
  selectedChordIdx = -1;
  chordStack = [];
  stackedChordKeys = new Set();
  history.replaceState(null, '', location.pathname + location.search);
  stopAll();
  drawPlot();
}

document.getElementById('panel-close').addEventListener('click', closePanel);

// Panel resize drag
{
  const panel = document.getElementById('info-panel');
  const handle = panel.querySelector('.panel-resize');
  let resizing = false, resizeStartY = 0, resizeStartH = 0;

  handle.addEventListener('mousedown', (e) => {
    resizing = true;
    resizeStartY = e.clientY;
    resizeStartH = panel.offsetHeight;
    e.preventDefault();
  });

  window.addEventListener('mousemove', (e) => {
    if (!resizing) return;
    const dy = resizeStartY - e.clientY;
    const newH = Math.max(100, Math.min(window.innerHeight * 0.7, resizeStartH + dy));
    panel.style.height = newH + 'px';
    scheduleRedraw(true);
  });

  window.addEventListener('mouseup', () => { resizing = false; });
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('info-panel').classList.contains('open')) closePanel();
  }
});

function parseStepRatios(str) {
  if (!str.trim()) return null;
  const ratios = [];
  for (const tok of str.split(',')) {
    const m = tok.trim().match(/^(\d+)\s*[\/\:]\s*(\d+)$/);
    if (!m) continue;
    const n = +m[1], d = +m[2];
    if (d > 0 && n > d) ratios.push([n, d]);
  }
  if (ratios.length) return ratios;
  return str.trim().length ? [] : null;
}

function parseSearchTerms(raw) {
  if (!raw.trim()) return null;
  const terms = [];
  for (const tok of raw.split(',')) {
    const t = tok.trim().toLowerCase();
    if (!t) continue;
    const mStart = t.match(/^(\d+):$/);
    if (mStart) { terms.push({ num: +mStart[1], pos: 1 }); continue; }
    const mMid = t.match(/^:(\d+):$/);
    if (mMid) { terms.push({ num: +mMid[1], pos: 2 }); continue; }
    const mEnd = t.match(/^:(\d+)$/);
    if (mEnd) { terms.push({ num: +mEnd[1], pos: 4 }); continue; }
    if (/^\d+$/.test(t)) { terms.push({ num: +t, pos: 0 }); continue; }
    terms.push({ text: t, pos: 0 });
  }
  return terms.length ? terms : null;
}

function applyFilters() {
  const contour = document.getElementById('flt-contour').value;
  const maxR = +document.getElementById('flt-max-r').value || 128;
  const maxHard = +document.getElementById('flt-max-hard').value || 99;
  const searchTerms = parseSearchTerms(document.getElementById('flt-search').value);
  const stepRatios = parseStepRatios(document.getElementById('flt-steps').value);

  document.getElementById('flt-max-r-val').textContent = maxR;

  const pinnedKeys = new Set();
  if (selectedChordKey) pinnedKeys.add(selectedChordKey);
  for (const k of stackedChordKeys) pinnedKeys.add(k);
  for (const k of selectedInversionKeys) pinnedKeys.add(k);

  filteredChords = allChords.filter(c => {
    if (pinnedKeys.has(c.key)) return true;
    if (contour && c.contour !== contour) return false;
    if (c.r > maxR) return false;
    if (c.H > maxHard) return false;
    if (searchTerms) {
      let anyMatch = false;
      for (const term of searchTerms) {
        if (term.text !== undefined) {
          if (c.key.includes(term.text) ||
              (c.displayName && c.displayName.toLowerCase().includes(term.text)) ||
              (c.name && c.name.toLowerCase().includes(term.text)) ||
              c.genericName.toLowerCase().includes(term.text)) {
            anyMatch = true;
          }
          continue;
        }
        const n = term.num;
        if (term.pos === 1 && c.p === n) anyMatch = true;
        else if (term.pos === 2 && c.q === n) anyMatch = true;
        else if (term.pos === 4 && c.r === n) anyMatch = true;
        else if (term.pos === 0 && (c.p === n || c.q === n || c.r === n)) anyMatch = true;
      }
      if (!anyMatch) return false;
    }
    if (stepRatios) {
      const lowerOk = stepRatios.some(([n, d]) => c.q * d === c.p * n);
      const upperOk = stepRatios.some(([n, d]) => c.r * d === c.q * n);
      if (!lowerOk || !upperOk) return false;
    }
    return true;
  });

  document.getElementById('chord-count').textContent = `${filteredChords.length} chords`;
  drawPlot();
}

// ═══════════════════════════════════════════
// GENERATION + WIRING
// ═══════════════════════════════════════════

function generate() {
  const maxR = +document.getElementById('cfg-max-r').value || 100;
  const fMinEl = document.getElementById('cfg-frame-min');
  const fMaxEl = document.getElementById('cfg-frame-max');
  const fMin = fMinEl.value !== '' ? +fMinEl.value : 0;
  const fMax = fMaxEl.value !== '' ? +fMaxEl.value : 1199;
  const mode = document.getElementById('cfg-gen-mode').value;

  const t0 = performance.now();
  if (mode === 'thirds') {
    allChords = enumerateThirdsMode(fMin, fMax, maxR * 2 - 1);
  } else {
    allChords = enumerateChords(maxR, fMin, fMax, maxR * 2 - 1);
  }
  const dt = (performance.now() - t0).toFixed(0);
  document.getElementById('status-text').textContent =
    `Generated ${allChords.length} chords in ${dt}ms (${mode} mode, r≤${maxR})`;
  const fltR = document.getElementById('flt-max-r');
  fltR.max = maxR;
  fltR.value = Math.min(64, maxR);
  filteredChords = allChords;
  computeViewBounds();
  applyFilters();
}

document.getElementById('btn-regenerate').addEventListener('click', generate);

['flt-contour', 'flt-max-r', 'flt-max-hard', 'flt-search', 'flt-steps'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
});

document.getElementById('btn-tertian').addEventListener('click', () => {
  const el = document.getElementById('flt-steps');
  el.value = '5/4, 6/5, 7/6, 9/7, 11/9, 13/10, 13/11, 14/11, 15/13, 27/22';
  applyFilters();
});

document.getElementById('flt-reveal').addEventListener('input', () => {
  document.getElementById('flt-reveal-val').textContent = document.getElementById('flt-reveal').value;
  scheduleRedraw(false);
});

function updateEdoOverlay() {
  const edoList = document.getElementById('flt-edo-overlay').value
    .split(',').map(s => +s.trim()).filter(n => n >= 2 && n <= 200);
  const upto = +document.getElementById('flt-edo-upto').value;
  const edos = new Set(edoList);
  if (upto >= 2 && upto <= 72) {
    for (let n = 2; n <= upto; n++) edos.add(n);
  }
  edoOverlayTriads = [];
  for (const n of [...edos].sort((a, b) => a - b)) {
    for (const t of generateEdoTriads(n)) edoOverlayTriads.push(t);
  }
  hoveredEdoTriad = -1;
  requestAnimationFrame(drawPlot);
}
document.getElementById('flt-edo-overlay').addEventListener('input', updateEdoOverlay);
document.getElementById('flt-edo-upto').addEventListener('input', updateEdoOverlay);

// ═══════════════════════════════════════════
// URL HASH STATE
// ═══════════════════════════════════════════

function openFromHash() {
  const hash = location.hash.replace('#', '').trim();
  if (!hash) return;
  let idx = filteredChords.findIndex(c => c.key === hash);
  if (idx < 0) {
    document.getElementById('flt-contour').value = '';
    document.getElementById('flt-max-hard').value = '99';
    document.getElementById('flt-reveal').value = '50';
    document.getElementById('flt-reveal-val').textContent = '50';
    document.getElementById('flt-search').value = '';
    document.getElementById('flt-steps').value = '';
    applyFilters();
    idx = filteredChords.findIndex(c => c.key === hash);
  }
  if (idx >= 0) selectChord(idx);
}

// ═══════════════════════════════════════════

{
  const toggle = document.getElementById('theme-toggle');
  const dropdown = document.getElementById('theme-dropdown');

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });

  document.addEventListener('click', () => dropdown.classList.remove('open'));
  dropdown.addEventListener('click', (e) => e.stopPropagation());

  dropdown.querySelectorAll('.theme-option').forEach(btn => {
    btn.addEventListener('click', () => {
      setTheme(btn.dataset.theme);
      dropdown.classList.remove('open');
      if (document.getElementById('info-panel').classList.contains('open')) {
        if (selectedChordIdx >= 0) showPanel(filteredChords[selectedChordIdx]);
        else if (chordStack.length > 1) {
          const merged = mergeStack(chordStack);
          if (merged) showStackPanel(merged);
        }
      }
    });
  });

  const saved = document.documentElement.getAttribute('data-theme') || 'midnight';
  dropdown.querySelectorAll('.theme-option').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === saved);
  });
}

generate();
openFromHash();
window.addEventListener('hashchange', openFromHash);
